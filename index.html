<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><title>MMII Aula 1 — Anatomia Topográfica</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
:root{--bg:#06111f;--card:#0f1b2e;--card2:#13243d;--ink:#f8fafc;--muted:#cbd5e1;--line:#29415f;--a:#38bdf8;--b:#a78bfa;--ok:#22c55e;--warn:#f59e0b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top left,#123b62 0,#06111f 34%,#020617 100%);color:var(--ink)}header{position:sticky;top:0;z-index:20;background:rgba(2,6,23,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 14px 10px}.top{max-width:1180px;margin:auto;display:flex;gap:14px;align-items:center;justify-content:space-between}.brand h1{font-size:18px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}button,.tab{border:1px solid var(--line);background:linear-gradient(135deg,var(--card2),#0b1324);color:var(--ink);padding:10px 12px;border-radius:14px;font-weight:700;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.18)}button:hover,.tab:hover{transform:translateY(-1px);border-color:var(--a)}.tabs{max-width:1180px;margin:10px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tab.active{background:linear-gradient(135deg,#0369a1,#6d28d9);border-color:#7dd3fc}.wrap{max-width:1180px;margin:auto;padding:18px 14px 70px}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:14px;margin-bottom:16px}.panel{background:rgba(15,27,46,.82);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.22)}.hero h2{margin:0 0 8px;font-size:25px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:18px;padding:12px}.stat b{font-size:22px;color:#7dd3fc}.search{width:100%;padding:13px;border-radius:16px;border:1px solid var(--line);background:#07111f;color:var(--ink);margin:8px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.card{background:linear-gradient(180deg,rgba(19,36,61,.96),rgba(10,18,32,.96));border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 16px 40px rgba(0,0,0,.22)}.tag{display:inline-flex;font-size:11px;color:#dbeafe;border:1px solid #2563eb;background:rgba(37,99,235,.18);padding:4px 8px;border-radius:999px;margin-bottom:8px}.card h3{margin:4px 0 8px;font-size:17px}.card small{color:var(--muted)}textarea,input[type=text]{width:100%;min-height:80px;margin-top:10px;background:#06111f;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px;resize:vertical}.photoBox{margin-top:10px;border:1px dashed #51708f;border-radius:14px;padding:10px}.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.photos img{width:76px;height:76px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.mini{font-size:12px;padding:8px 10px}.hidden{display:none!important}.footerbar{position:fixed;bottom:0;left:0;right:0;background:rgba(2,6,23,.9);border-top:1px solid var(--line);padding:8px 14px;display:flex;justify-content:center;gap:8px;z-index:30}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:760px){.hero{grid-template-columns:1fr}.tabs{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.hero h2{font-size:21px}}
</style></head><body>
<header><div class="top"><div class="brand"><h1>ANATOMIA TOPOGRÁFICA DE MMII — Aula 1</h1><p>UEM • Roteiro prático • regiões, fáscias, drenagem venosa, linfonodos e artérias</p></div><div class="actions"><button id="btnInstall">📲 Baixar app</button><button onclick="gerarPDF()">📄 Gerar PDF</button><button onclick="exportarJSON()">💾 Salvar dados</button></div></div><nav class="tabs" id="tabs"></nav></header>
<main class="wrap"><section class="hero"><div class="panel"><h2 id="tituloAba"></h2><p id="descAba"></p><input class="search" id="busca" placeholder="Pesquisar estrutura..."></div><div class="panel stats"><div class="stat"><b id="total">0</b><br><span>estruturas</span></div><div class="stat"><b id="respondidas">0</b><br><span>com resposta</span></div><div class="stat"><b id="fotos">0</b><br><span>fotos</span></div></div></section><section class="grid" id="grid"></section></main>
<div class="footerbar"><button onclick="window.scrollTo({top:0,behavior:'smooth'})">⬆️ Topo</button><button onclick="limparAba()">🧹 Limpar aba</button></div>
<script>
const ABAS=[{id:'g1',nome:'Grupo 1',desc:'Regiões e estruturas fasciais do membro inferior.',itens:[
['Regiões','Região glútea'],['Regiões','Fenda interglútea'],['Regiões','Sulco infraglúteo'],['Regiões','Região do quadril'],['Regiões','Região da coxa'],['Regiões','Região femoral anterior'],['Regiões','Trígono femoral'],['Regiões','Região femoral posterior'],['Regiões','Região do joelho'],['Regiões','Região genicular anterior'],['Regiões','Região genicular posterior'],['Regiões','Fossa poplítea'],['Regiões','Região crural anterior'],['Regiões','Região crural posterior'],['Regiões','Região talocrural anterior'],['Regiões','Região talocrural posterior'],['Regiões','Região retromaleolar lateral'],['Regiões','Região retromaleolar medial'],['Regiões','Regiões do pé'],['Regiões','Região calcânea'],['Regiões','Dorso do pé'],['Regiões','Planta'],['Regiões','Margem lateral do pé'],['Regiões','Margem medial do pé'],['Regiões','Arco longitudinal do pé — Parte lateral'],['Regiões','Arco longitudinal do pé — Parte medial'],['Regiões','Arco transverso do pé'],['Regiões','Região tarsal'],['Regiões','Região metatarsal'],['Regiões','Dedos do pé'],['Estruturas fasciais','Fáscia lata'],['Estruturas fasciais','Trato iliotibial'],['Estruturas fasciais','Trato iliopatelar'],['Estruturas fasciais','Septo intermuscular lateral da coxa'],['Estruturas fasciais','Septo intermuscular medial da coxa'],['Estruturas fasciais','Septo intermuscular posterior da coxa'],['Estruturas fasciais','Compartimento anterior da coxa'],['Estruturas fasciais','Compartimento posterior da coxa'],['Estruturas fasciais','Compartimento medial da coxa'],['Estruturas fasciais','Fáscia da perna (crural)'],['Estruturas fasciais','Retináculo dos músculos flexores'],['Estruturas fasciais','Retináculo superior dos músculos extensores'],['Estruturas fasciais','Retináculo inferior dos músculos extensores'],['Estruturas fasciais','Retináculo superior dos músculos fibulares'],['Estruturas fasciais','Retináculo inferior dos músculos fibulares'],['Estruturas fasciais','Septo intermuscular anterior da perna'],['Estruturas fasciais','Septo intermuscular posterior da perna'],['Estruturas fasciais','Septo intermuscular transverso da perna'],['Estruturas fasciais','Membrana interóssea da perna'],['Estruturas fasciais','Compartimento anterior da perna'],['Estruturas fasciais','Compartimento posterior da perna'],['Estruturas fasciais','Parte superficial'],['Estruturas fasciais','Parte profunda'],['Estruturas fasciais','Compartimento lateral da perna'],['Estruturas fasciais','Fáscia dorsal do pé'],['Estruturas fasciais','Fáscia plantar lateral'],['Estruturas fasciais','Fáscia plantar medial'],['Estruturas fasciais','Aponeurose plantar'],['Estruturas fasciais','Feixes digitais da aponeurose plantar'],['Estruturas fasciais','Fascículos transversos da aponeurose plantar'],['Estruturas fasciais','Ligamentos metatarsais transversos superficiais']]},
{id:'g2',nome:'Grupo 2',desc:'Drenagem venosa superficial, profunda e linfonodos dos MMII.',itens:[
['Drenagem venosa superficial','vv. Digitais dorsais'],['Drenagem venosa superficial','vv. Metatarsais dorsais'],['Drenagem venosa superficial','Arco venoso dorsal do pé'],['Drenagem venosa superficial','Rede venosa dorsal'],['Drenagem venosa superficial','v. Dorsal do hálux'],['Drenagem venosa superficial','v. Safena magna'],['Drenagem venosa superficial','v. Cutânea lateral da coxa'],['Drenagem venosa superficial','v. Cutânea anterior da coxa'],['Drenagem venosa superficial','Hiato safeno'],['Drenagem venosa superficial','Margem falciforme'],['Drenagem venosa superficial','Fáscia cribriforme'],['Drenagem venosa superficial','v. Dorsal do 5º dedo'],['Drenagem venosa superficial','v. Marginal lateral'],['Drenagem venosa superficial','v. Marginal medial'],['Drenagem venosa superficial','v. Safena parva'],['Drenagem venosa superficial','v. Safena acessória'],['Drenagem venosa profunda','vv. Digitais plantares'],['Drenagem venosa profunda','vv. Metatarsais plantares'],['Drenagem venosa profunda','Arco venoso plantar'],['Drenagem venosa profunda','v. Plantar lateral do pé'],['Drenagem venosa profunda','v. Plantar medial do pé'],['Drenagem venosa profunda','v. Tibial posterior'],['Drenagem venosa profunda','v. Fibular'],['Drenagem venosa profunda','v. Tibial anterior'],['Drenagem venosa profunda','v. Poplítea'],['Drenagem venosa profunda','v. Femoral'],['Drenagem venosa profunda','v. Femoral profunda'],['Drenagem venosa profunda','vv. Perfurantes'],['Drenagem venosa profunda','v. Glútea superior'],['Drenagem venosa profunda','v. Glútea inferior'],['Drenagem venosa profunda','v. Ilíaca externa'],['Linfonodos','Linfonodos poplíteos'],['Linfonodos','Linfonodos inguinais superficiais'],['Linfonodos','Linfonodos inguinais profundos'],['Linfonodos','Linfonodos ilíacos externos'],['Linfonodos','Linfonodos ilíacos comuns'],['Linfonodos','Troncos linfáticos lombares']]},
{id:'g3',nome:'Grupo 3',desc:'Artérias dos membros inferiores.',itens:[
['Artérias','a. Ilíaca externa'],['Artérias','a. Femoral'],['Artérias','a. Circunflexa ilíaca superficial'],['Artérias','a. Epigástrica superficial'],['Artérias','a. Pudenda externa superficial'],['Artérias','a. Pudenda externa profunda'],['Artérias','a. Femoral profunda'],['Artérias','a. Circunflexa femoral medial'],['Artérias','a. Circunflexa femoral lateral'],['Artérias','Ramo descendente da a. circunflexa femoral lateral'],['Artérias','a. Descendente do joelho'],['Artérias','a. Obturatória'],['Artérias','a. Glútea superior'],['Artérias','a. Glútea inferior'],['Artérias','a. Poplítea'],['Artérias','a. Tibial anterior'],['Artérias','Tronco tíbiofibular'],['Artérias','a. Tibial posterior'],['Artérias','a. Fibular'],['Artérias','a. Superior lateral do joelho'],['Artérias','a. Superior medial do joelho'],['Artérias','a. Inferior lateral do joelho'],['Artérias','a. Inferior medial do joelho'],['Artérias','a. Média do joelho'],['Artérias','Recorrente tibial anterior'],['Artérias','a. Tarsal lateral'],['Artérias','a. Dorsal do pé'],['Artérias','a. Arqueada'],['Artérias','a. Plantar profunda'],['Artérias','1ª a. Metatarsal dorsal'],['Artérias','aa. Metatarsais dorsais'],['Artérias','aa. Digitais dorsais comum'],['Artérias','aa. Digitais dorsais próprias'],['Artérias','a. Plantar medial'],['Artérias','a. Plantar lateral'],['Artérias','Arco plantar profundo'],['Artérias','aa. Metatarsais plantares'],['Artérias','aa. Digitais plantares comum'],['Artérias','aa. Digitais plantares próprias']]}];
let aba=localStorage.getItem('abaMMII')||'g1';let dados=JSON.parse(localStorage.getItem('dadosMMII')||'{}');let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});document.getElementById('btnInstall').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice}else alert('No celular: abra pelo navegador e toque em “Adicionar à tela inicial”.')};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
function key(i){return aba+'_'+i}function salvar(){localStorage.setItem('dadosMMII',JSON.stringify(dados))}
function renderTabs(){tabs.innerHTML=ABAS.map(a=>`<button class="tab ${a.id==aba?'active':''}" onclick="aba='${a.id}';localStorage.setItem('abaMMII',aba);render()">${a.nome}<br><small>${a.itens.length} itens</small></button>`).join('')}
function render(){renderTabs();const A=ABAS.find(x=>x.id==aba);tituloAba.textContent=A.nome+' — '+A.desc;descAba.textContent='Cada card permite praticar, escrever resposta e anexar/tirar quantas fotos quiser por estrutura.';const q=busca.value?.toLowerCase()||'';let html='';A.itens.forEach((it,i)=>{if((it[0]+' '+it[1]).toLowerCase().includes(q)){const d=dados[key(i)]||{resp:'',fotos:[]};html+=`<article class="card"><span class="tag">${it[0]}</span><h3>${i+1}. ${it[1]}</h3><small>Prática: identifique na peça/esqueleto, marque a topografia e fotografe a estrutura.</small><textarea placeholder="Resposta do aluno / observações anatômicas..." oninput="setResp(${i},this.value)">${d.resp||''}</textarea><div class="photoBox"><input type="file" accept="image/*" capture="environment" multiple onchange="addFotos(${i},this.files)"><div class="photos">${(d.fotos||[]).map((src,j)=>`<img src="${src}" title="foto ${j+1}">`).join('')}</div><button class="mini" onclick="limparFotos(${i})">remover fotos desta estrutura</button></div></article>`}});grid.innerHTML=html||'<div class="empty">Nenhuma estrutura encontrada.</div>';atualizarStats()}
function setResp(i,v){dados[key(i)]={...(dados[key(i)]||{}),resp:v,fotos:(dados[key(i)]||{}).fotos||[]};salvar();atualizarStats()}
function addFotos(i,files){const d=dados[key(i)]||{resp:'',fotos:[]};[...files].forEach(f=>{const r=new FileReader();r.onload=e=>{d.fotos.push(e.target.result);dados[key(i)]=d;salvar();render()};r.readAsDataURL(f)})}
function limparFotos(i){if(confirm('Remover fotos desta estrutura?')){const d=dados[key(i)]||{};d.fotos=[];dados[key(i)]=d;salvar();render()}}
function atualizarStats(){const A=ABAS.find(x=>x.id==aba);total.textContent=A.itens.length;respondidas.textContent=A.itens.filter((_,i)=>(dados[key(i)]?.resp||'').trim()).length;fotos.textContent=A.itens.reduce((s,_,i)=>s+(dados[key(i)]?.fotos?.length||0),0)}
busca.oninput=render;
async function gerarPDF(){const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});let y=14;doc.setFont('times','bold');doc.setFontSize(14);doc.text('ANATOMIA TOPOGRÁFICA DE MMII — Aula 1',105,y,{align:'center'});y+=8;for(const A of ABAS){doc.setFont('times','bold');doc.setFontSize(12);doc.text(A.nome+' — '+A.desc,12,y);y+=7;doc.setFont('times','normal');doc.setFontSize(10);for(let i=0;i<A.itens.length;i++){const d=dados[A.id+'_'+i]||{};const linha=`${i+1}. [${A.itens[i][0]}] ${A.itens[i][1]}`;let parts=doc.splitTextToSize(linha,184);if(y>280){doc.addPage();y=14}doc.text(parts,12,y);y+=parts.length*5;if(d.resp){let r=doc.splitTextToSize('Resposta/observação: '+d.resp,178);if(y+r.length*5>280){doc.addPage();y=14}doc.text(r,16,y);y+=r.length*5}for(const img of (d.fotos||[])){if(y>220){doc.addPage();y=14}try{doc.addImage(img,'JPEG',16,y,45,35);y+=39}catch(e){}}y+=1}}doc.save('MMII_Aula1_material_pratico.pdf')}
function exportarJSON(){const blob=new Blob([JSON.stringify(dados,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dados-mmii-aula1.json';a.click()}
function limparAba(){if(confirm('Limpar respostas e fotos da aba atual?')){Object.keys(dados).forEach(k=>{if(k.startsWith(aba+'_'))delete dados[k]});salvar();render()}}
render();
</script></body></html>
